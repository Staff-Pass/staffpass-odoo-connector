name: Validate Odoo addon

on:
  push:
    branches: ["19.0", "18.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements-dev.txt
      - run: python tools/validate_addon.py
      - run: python -m compileall -q staffpass_payroll_connector tools
      - run: ruff check .
